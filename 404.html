<body class="page-sub page-404" data-page="404" data-view="players" data-root="/">
    <div class="world" aria-hidden="true">
        <canvas id="worldSky"></canvas>
        <div class="world-under">
            <div class="stratum s-a"></div>
            <div class="stratum s-b"></div>
            <div class="stratum s-c"></div>
            <div class="shaft"><div class="shaft-top"></div></div>
            <div class="stratum s-bed"></div>
        </div>
    </div>

    <header class="topbar">
        <a href="/" class="topbar-brand">
            <img src="/assets/solaryn-icon.png" alt="" width="32" height="32">
            <span>Solaryn</span>
        </a>
        <div class="topbar-spacer"></div>
        <button type="button" class="chip" id="themeBtn" aria-label="Világválasztó"><span class="chip-ico"></span><span class="chip-label">Világok</span></button>

    <main class="err">
        <div class="err-code" aria-hidden="true">404</div>
        <h1 class="err-title">Ez az oldal eltűnt a térképről</h1>
        <p class="err-text">A keresett cím nem létezik, vagy időközben megváltozott. Valószínűleg a főoldalról már egy kattintással megtalálod, amit keresel.</p>
        <div class="err-actions">
            <a class="btn btn-gold btn-big" href="/"><span data-ico="home"></span>Vissza a főoldalra</a>
            <a class="chip" href="/#gyik" style="height:64px;padding:0 18px">Gyakori kérdések</a>
        </div>
        <p class="err-path">Kért cím: <span id="errPath"></span></p>
    </main>

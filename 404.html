<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.overclockgame.hu:8908; connect-src 'self' https://api.overclockgame.hu:8908; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A keresett oldal nem található - Solaryn Network</title>
    <meta name="description" content="A keresett oldal nem található a Solaryn Network weboldalán.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#07070a">
    <link rel="icon" type="image/png" href="/assets/solaryn-icon.png">
    <link rel="apple-touch-icon" href="/assets/solaryn-icon.png">
    <link rel="stylesheet" href="/style.css?v=20261001">
    <link rel="stylesheet" href="/ui.css?v=20261001">
    <link rel="stylesheet" href="/design.css?v=20261001">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .err-wrap { position: relative; z-index: 1; text-align: center; max-width: 560px; width: 100%; }
        .err-brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 40px; }
        .err-brand img { width: 40px; height: 40px; filter: drop-shadow(0 0 10px var(--gold-glow)); }
        .err-brand span { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
        .err-code {
            font-family: var(--font-display);
            font-size: clamp(88px, 22vw, 150px); font-weight: 900; line-height: .9;
            background: linear-gradient(120deg, var(--gold) 10%, var(--orange) 50%, var(--gold-2) 90%);
            background-size: 220% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: errSheen 5s linear infinite;
            filter: drop-shadow(0 10px 40px var(--gold-glow));
        }
        @keyframes errSheen { to { background-position: 220% center; } }
        .err-title { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; margin: 16px 0 12px; }
        .err-text { color: var(--text-dim); font-size: 1rem; line-height: 1.7; margin-bottom: 34px; }
        .err-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .err-actions .btn-outline-nav { padding: 13px 26px; font-size: 0.92rem; }
        .err-path {
            margin-top: 30px; font-size: 12px; color: var(--text-faint); word-break: break-all;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        }
        @media (prefers-reduced-motion: reduce) {
            .err-code { animation: none; }
        }
    </style>
</head>

<body>
    <canvas class="particle-canvas" id="particleCanvas" aria-hidden="true"></canvas>

    <main class="err-wrap">
        <a class="err-brand" href="/">
            <img src="/assets/solaryn-icon.png" alt="" width="40" height="40">
            <span>Solaryn Network</span>
        </a>

        <div class="err-code" aria-hidden="true">404</div>
        <h1 class="err-title">Ez az oldal eltűnt a térképről</h1>
        <p class="err-text">A keresett cím nem létezik, vagy időközben megváltozott. Valószínűleg a főoldalról már egy kattintással megtalálod, amit keresel.</p>

        <div class="err-actions">
            <a class="btn-glow-download" href="/">Vissza a főoldalra</a>
            <a class="btn-outline-nav" href="/#gyik">Gyakori kérdések</a>
        </div>

        <p class="err-path">Kért cím: <span id="errPath"></span></p>
    </main>

    <script src="/404.js?v=20261001"></script>
</body>

</html>
